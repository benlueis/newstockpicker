name: Daily Stock Scan

on:
  schedule:
    # 工作日 16:00 CST (08:00 UTC) 跑，给 baostock 留出收盘后数据刷新时间
    - cron: '0 8 * * 1-5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyarrow

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Lint check
        run: pip install flake8 && flake8 strategies/ scripts/ --count --statistics

      - name: Set timezone to Shanghai
        run: |
          sudo timedatectl set-timezone Asia/Shanghai || true
          date

      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: stock-cache-${{ runner.os }}
          restore-keys: stock-cache-

      - name: Update cache (incremental)
        run: python scripts/update_cache.py

      - name: Refresh stock list (skip on failure)
        continue-on-error: true
        run: python data/get_stock_list.py

      - name: Run breakout scan
        run: python scripts/daily_scan.py

      - name: Run dragon leader scan
        run: python scripts/scan_dragon.py

      - name: Run sideways breakout scan
        run: python scripts/sideways_scan.py

      - name: Run pullback MA5 scan
        run: python scripts/pullback_ma5_scan.py

      - name: Push summary to iPhone
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
        run: python scripts/push_summary.py "收盘扫描"

      - name: Upload scan CSVs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-${{ github.run_id }}
          path: data/*.csv
          retention-days: 30
